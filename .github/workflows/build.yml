name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: inkline-windows-x64
            bundle_format: wxsmsi
            installer_path: target/release/bundle/wxsmsi/bin/Release/inkline.msi
            installer_name: inkline-windows-x64.msi
          - os: macos-latest
            artifact: inkline-macos
            bundle_format: dmg
            installer_path: target/release/bundle/dmg/Inkline.dmg
            installer_name: inkline-macos.dmg
          - os: ubuntu-latest
            artifact: inkline-linux-amd64
            bundle_format: deb
            installer_path: target/release/bundle/deb/inkline_*.deb
            installer_name: inkline-linux-amd64.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Set up .NET SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer
        run: cargo bundle --release --format ${{ matrix.bundle_format }}

      - name: Stage installer
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.installer_path }} dist/${{ matrix.installer_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp artifacts/inkline-windows-x64/inkline-windows-x64.msi dist/
          cp artifacts/inkline-macos/inkline-macos.dmg dist/
          cp artifacts/inkline-linux-amd64/inkline-linux-amd64.deb dist/

      - name: Publish latest release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          name: Latest build
          body: Automated build from the latest main branch commit.
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "dist/inkline-windows-x64.msi,dist/inkline-macos.dmg,dist/inkline-linux-amd64.deb"
