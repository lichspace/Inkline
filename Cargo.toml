[package]
name = "inkline"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
    "accesskit",
    "web_screen_reader",
] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
wgpu = "29.0.0"
kurbo = "0.13.1"
lyon = "1.0.19"
freedraw = "1.0.4"
rstar = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
