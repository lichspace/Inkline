[package]
name = "inkline"
version = "0.1.0"
edition = "2021"
description = "GPU-accelerated vector drawing application"
authors = ["Inkline contributors <inkline@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/lichspace/Inkline"
homepage = "https://github.com/lichspace/Inkline"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
    "accesskit",
    "web_screen_reader",
] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
wgpu = "29.0.0"
kurbo = "0.13.1"
lyon = "1.0.19"
freedraw = "1.0.4"
rstar = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"

[package.metadata.bundle]
name = "Inkline"
identifier = "io.github.lichspace.inkline"
category = "Graphics"
short_description = "GPU-accelerated vector drawing application"
long_description = "Inkline is a lightweight, GPU-accelerated vector drawing application built with Rust, egui, and wgpu."
copyright = "Copyright (c) 2026 Inkline contributors"
deb_depends = [
    "libgtk-3-0",
    "libwayland-client0",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb1",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
]
